<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena of Steel — Roguelike</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#d4a32a;--gold2:#7a5a10;--dark0:#07070a;--dark1:#0f0f0d;
  --dark2:#161614;--dark3:#1e1e1a;--border:#2a2010;
  --blue:#3a7abf;--bhi:#5aaae8;--red:#bf3a3a;--rhi:#e85a5a;
  --green:#3a9a50;--purple:#8a4abf;--text:#d8cdb0;--muted:#666
}
html,body{width:100%;height:100%;background:var(--dark0);color:var(--text);
  font-family:'Georgia','Times New Roman',serif;overflow:hidden;user-select:none}
#root{display:flex;flex-direction:column;width:100vw;height:100vh}

/* HEADER */
#header{flex-shrink:0;height:46px;background:linear-gradient(180deg,#1c1508,var(--dark1));
  border-bottom:2px solid var(--gold2);display:flex;align-items:center;padding:0 10px;gap:10px}
#header h1{font-size:15px;color:var(--gold);text-shadow:0 0 14px #d4a32a66;
  letter-spacing:3px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
#level-badge{background:var(--dark3);border:1px solid var(--gold2);border-radius:4px;
  padding:3px 10px;font-size:11px;color:var(--gold);white-space:nowrap;flex-shrink:0}
#pb-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
#pb-label{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
#pb-track{width:100%;max-width:300px;height:12px;background:#111;border:1px solid #333;
  border-radius:6px;overflow:hidden;position:relative}
#pb-blue{position:absolute;left:0;top:0;height:100%;
  background:linear-gradient(90deg,#1a5fa8,#4aa0e8);transition:width .35s;border-radius:6px 0 0 6px}
#pb-red{position:absolute;right:0;top:0;height:100%;
  background:linear-gradient(270deg,#a81a1a,#e84a4a);transition:width .35s;border-radius:0 6px 6px 0}
#pb-mid{position:absolute;left:50%;top:0;width:2px;height:100%;background:#fff3;transform:translateX(-50%)}
#hbtns{display:flex;gap:5px;flex-shrink:0}
.btn{padding:5px 11px;border:1px solid var(--gold2);background:linear-gradient(180deg,#2a1e00,#1a1208);
  color:var(--gold);font-family:inherit;font-size:11px;cursor:pointer;border-radius:3px;
  letter-spacing:1px;text-transform:uppercase;transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#3d2c00,#2a1e00);border-color:var(--gold)}
.btn:disabled{opacity:.35;cursor:default}
.btn.danger{border-color:#6a1a1a;color:#e04040}
.btn.danger:hover:not(:disabled){background:linear-gradient(180deg,#2a0000,#180808);border-color:#e04040}
.btn.purple{border-color:#5a2a8a;color:#c080ff}
.btn.purple:hover:not(:disabled){background:linear-gradient(180deg,#2a1040,#180820);border-color:#c080ff}
/* music btn */
#btnMusic{font-size:14px;padding:4px 10px}

/* BODY */
#body{flex:1;display:flex;min-height:0}
#cv-wrap{flex:1;position:relative;min-width:0;overflow:hidden}
#gameCanvas{display:block}

/* OVERLAYS */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#000000bb;opacity:0;pointer-events:none;transition:opacity .4s;z-index:50}
.overlay.show{opacity:1;pointer-events:all}
.ov-box{background:linear-gradient(180deg,#1e1608,var(--dark1));border:2px solid var(--gold);
  border-radius:8px;padding:28px 44px;text-align:center;box-shadow:0 0 60px #d4a32a44;max-width:92vw}
#ov-title{font-size:30px;font-weight:bold;margin-bottom:8px;text-shadow:0 0 20px currentColor}
#ov-sub{font-size:13px;color:#aaa;margin-bottom:18px}

/* LEVEL UP */
#levelup-ov{z-index:60}
#lu-box{background:linear-gradient(180deg,#0e0a1e,#080810);border:2px solid #8a4abf;
  border-radius:10px;padding:24px 28px;max-width:720px;width:96vw;
  box-shadow:0 0 80px #8a4abf55}
#lu-title{font-size:20px;color:#c080ff;text-align:center;margin-bottom:4px;letter-spacing:2px}
#lu-sub{font-size:11px;color:var(--muted);text-align:center;margin-bottom:16px}
#lu-cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.skill-card{background:#12101e;border:2px solid #3a2060;border-radius:8px;padding:12px 14px;
  width:170px;cursor:pointer;transition:.2s;text-align:center}
.skill-card:hover{border-color:#c080ff;background:#1a1430;transform:translateY(-3px)}
.skill-card.owned{border-color:#3a5a3a;cursor:default;opacity:.55}
.skill-ico{font-size:26px;margin-bottom:5px}
.skill-name{font-size:11px;color:#c080ff;font-weight:bold;margin-bottom:3px}
.skill-desc{font-size:9px;color:var(--muted);line-height:1.5}
.skill-cost{font-size:9px;color:var(--gold);margin-top:5px}

/* LORD PORTRAIT — bottom left */
#lord-portrait-area{
  position:absolute;left:8px;bottom:8px;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:30
}
#lord-portrait-frame{
  width:72px;height:72px;border-radius:8px;
  border:2px solid var(--gold2);background:linear-gradient(180deg,#1a1208,#0a0a0a);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;position:relative;cursor:pointer;
  box-shadow:0 0 12px #00000088
}
#lord-portrait-frame.berserk{border-color:#ff4400;box-shadow:0 0 20px #ff440088}
#lord-hp-bar{width:72px;height:5px;background:#111;border-radius:3px;overflow:hidden}
#lord-hp-fill{height:100%;background:linear-gradient(90deg,#3a7abf,#5aaae8);transition:width .3s;border-radius:3px}
#lord-name-label{font-size:9px;color:var(--gold);letter-spacing:1px;text-align:left}

/* SPELL BAR — above portrait */
#spell-bar{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.spell-btn{
  width:72px;height:44px;border-radius:6px;
  border:2px solid #333;background:#0e0e0e;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s;position:relative;
  flex-direction:column;gap:1px
}
.spell-btn:hover{border-color:#c080ff;background:#1a1028}
.spell-btn.ready{border-color:#8a4abf;box-shadow:0 0 10px #8a4abf77}
.spell-btn.melee-ready{border-color:var(--gold);box-shadow:0 0 10px #d4a32a77}
.spell-btn.casting{border-color:#00ff88;box-shadow:0 0 14px #00ff8888;animation:pulse-cast .5s infinite alternate}
@keyframes pulse-cast{from{box-shadow:0 0 8px #00ff8855}to{box-shadow:0 0 20px #00ff88cc}}
.spell-ico{font-size:18px;line-height:1}
.spell-key{position:absolute;top:2px;right:4px;font-size:8px;color:#555}
.spell-cd-overlay{
  position:absolute;inset:0;background:#000000aa;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:bold;color:#fff
}
.spell-name-label{font-size:7px;color:#888;text-align:center;max-width:68px;line-height:1.2}

/* CAST CURSOR indicator */
#cast-indicator{
  position:absolute;pointer-events:none;z-index:40;
  display:none;transform:translate(-50%,-50%);
  width:20px;height:20px
}

/* SIDEBAR */
#sidebar{width:188px;flex-shrink:0;background:linear-gradient(180deg,#0e0e09,#090908);
  border-left:2px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-sec{padding:6px 9px 5px;border-bottom:1px solid var(--border)}
.sb-ttl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
#unit-detail{font-size:11px}
#no-sel{color:var(--muted);font-size:10px;text-align:center;padding:10px 0}
.stat-row{display:flex;justify-content:space-between;margin:1px 0}
.stat-lbl{font-size:10px;color:var(--muted)}
.stat-val{font-size:10px;color:var(--text);font-weight:bold}
.mini-bar{height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin:2px 0 4px}
.mini-bar-fill{height:100%;border-radius:2px;transition:width .3s}
#unit-list-wrap{flex:1;overflow-y:auto;padding:4px 7px;display:flex;flex-direction:column;gap:3px}
#unit-list-wrap::-webkit-scrollbar{width:3px}
#unit-list-wrap::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.ucard{background:#111108;border:1px solid #222;border-radius:4px;padding:4px 6px;cursor:pointer;transition:.15s}
.ucard:hover{border-color:var(--blue)}.ucard.sel{border-color:var(--bhi);background:#141c28}
.ucard.flee{border-color:#aa3333}.ucard.multi-sel{border-color:#4abf8a;background:#0e1e18}
.ucard-head{display:flex;align-items:center;gap:3px;margin-bottom:1px}
.ucard-ico{font-size:12px}.ucard-name{font-size:10px;color:#b0a070;flex:1}
.ucard-mini{font-size:9px;color:var(--muted)}
#skill-list{padding:3px 8px 5px;border-bottom:1px solid var(--border)}
.skill-tag{display:inline-block;background:#1a1030;border:1px solid #4a2a6a;border-radius:3px;
  font-size:9px;color:#c080ff;padding:1px 4px;margin:1px}
.skill-tag.melee{background:#201a08;border-color:#6a5a10;color:var(--gold)}
#log-wrap{height:95px;flex-shrink:0;border-top:1px solid var(--border);overflow-y:auto;padding:4px 7px}
.log-e{font-size:9px;line-height:1.55;color:#555}
.log-e.imp{color:var(--gold)}.log-e.bad{color:#cc3333}.log-e.good{color:#3a9a50}.log-e.magic{color:#c080ff}

#tip{position:fixed;background:#1a1208ee;border:1px solid var(--gold2);padding:5px 10px;
  font-size:11px;color:var(--gold);border-radius:4px;pointer-events:none;display:none;z-index:200;white-space:nowrap}
#ctrl-hint{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
  font-size:10px;color:#ffffff33;pointer-events:none;white-space:nowrap;letter-spacing:.5px}

/* SELECTION RECT drawn on canvas — handled in JS */
</style>
</head>
<body>
<div id="root">
<div id="header">
  <h1>⚔ Arena of Steel</h1>
  <div id="level-badge">Wave 1</div>
  <div id="pb-wrap">
    <div id="pb-label">Power Balance</div>
    <div id="pb-track">
      <div id="pb-blue" style="width:50%"></div>
      <div id="pb-red"  style="width:50%"></div>
      <div id="pb-mid"></div>
    </div>
  </div>
  <div id="hbtns">
    <button class="btn" id="btnMusic" title="Toggle Music">🎵</button>
    <button class="btn" id="btnStart">▶ Start</button>
    <button class="btn danger" id="btnRetreat" disabled>⚑ Retreat</button>
    <button class="btn" id="btnRestart" style="display:none">↺ New Run</button>
  </div>
</div>

<div id="body">
<div id="cv-wrap">
  <canvas id="gameCanvas"></canvas>

  <!-- End overlay -->
  <div class="overlay" id="end-overlay">
    <div class="ov-box">
      <div id="ov-title">VICTORY</div>
      <div id="ov-sub">Wave cleared!</div>
      <button class="btn purple" id="btnContinue" style="margin-right:8px">✦ Choose Upgrade</button>
      <button class="btn" id="btnEndRestart">↺ New Run</button>
    </div>
  </div>

  <!-- Levelup overlay -->
  <div class="overlay" id="levelup-ov">
    <div id="lu-box">
      <div id="lu-title">✦ CHOOSE YOUR POWER ✦</div>
      <div id="lu-sub">Pick one upgrade to carry into the next battle</div>
      <div id="lu-cards"></div>
      <button class="btn" id="btnSkip" style="margin-top:14px;font-size:10px">→ Skip</button>
    </div>
  </div>

  <!-- LORD PORTRAIT + SPELL BAR (bottom-left) -->
  <div id="lord-portrait-area">
    <div id="spell-bar"></div>
    <div id="lord-portrait-frame">
      <span id="lord-portrait-ico">🔮</span>
    </div>
    <div id="lord-hp-bar"><div id="lord-hp-fill" style="width:100%"></div></div>
    <div id="lord-name-label">Arcanis</div>
  </div>

  <div id="cast-indicator">🎯</div>
  <div id="ctrl-hint" style="display:none">
    LMB — Select / Drag box &nbsp;|&nbsp; RMB — Move / Attack &nbsp;|&nbsp; Click spell → target
  </div>
</div>

<div id="sidebar">
  <div class="sb-sec">
    <div class="sb-ttl">Selected Unit</div>
    <div id="unit-detail"><div id="no-sel">No unit selected</div></div>
  </div>
  <div id="skill-list">
    <div class="sb-ttl">Skills</div>
    <div id="active-skills-display"></div>
  </div>
  <div class="sb-sec" style="padding-bottom:3px">
    <div class="sb-ttl">Your Forces</div>
  </div>
  <div id="unit-list-wrap"></div>
  <div id="log-wrap"><div id="log-inner"></div></div>
</div>
</div>
</div>
<div id="tip"></div>

<script>
'use strict';
// ═══════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════
let _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}

// --- Procedural Music Engine ---
let musicOn=false, musicNodes=[], musicScheduled=false;

// Generates an epic orchestral loop using oscillators + noise
function startMusic(){
  if(musicOn)return; musicOn=true;
  scheduleMusicLoop();
}
function stopMusic(){
  musicOn=false;
  musicNodes.forEach(n=>{try{n.stop();}catch(e){}});
  musicNodes=[];
}
function toggleMusic(){
  ac();
  if(musicOn)stopMusic();else startMusic();
  document.getElementById('btnMusic').textContent=musicOn?'🔇':'🎵';
}

// Epic battle music: layered drones + melody + percussion
function scheduleMusicLoop(){
  if(!musicOn)return;
  const c=ac(), now=c.currentTime;
  const bpm=88, beat=60/bpm, bar=beat*4;
  const len=bar*8; // 8 bars

  // --- Bass drone ---
  const bassNotes=[55,55,49,52]; // A1,A1,G1,Ab1
  bassNotes.forEach((freq,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sawtooth'; o.frequency.value=freq;
    const t=now+i*bar*2;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.08,t+0.3);
    g.gain.setValueAtTime(0.08,t+bar*2-0.3);
    g.gain.linearRampToValueAtTime(0,t+bar*2);
    const filt=c.createBiquadFilter();filt.type='lowpass';filt.frequency.value=200;
    o.connect(filt);filt.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+bar*2+0.1);
    musicNodes.push(o);
  });

  // --- Brass stabs (epic chords) ---
  const chords=[
    [220,277,330],[196,247,294],[208,262,311],[233,294,349]
  ];
  chords.forEach((chord,ci)=>{
    chord.forEach(freq=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='square';o.frequency.value=freq;
      const t=now+ci*bar*2+beat*0.5;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.04,t+0.05);
      g.gain.exponentialRampToValueAtTime(0.001,t+beat*1.5);
      o.connect(g);g.connect(c.destination);
      o.start(t);o.stop(t+beat*2);
      musicNodes.push(o);
    });
  });

  // --- Heroic melody (trumpet-like) ---
  const melody=[
    {f:440,d:beat*.5},{f:494,d:beat*.5},{f:523,d:beat},
    {f:494,d:beat*.5},{f:440,d:beat*.5},{f:392,d:beat*2},
    {f:415,d:beat*.5},{f:440,d:beat*.5},{f:494,d:beat},
    {f:523,d:beat*.5},{f:494,d:beat*.5},{f:440,d:beat*3},
  ];
  let mt=now+bar*4;
  melody.forEach(note=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='triangle';o.frequency.value=note.f;
    g.gain.setValueAtTime(0,mt);
    g.gain.linearRampToValueAtTime(0.09,mt+0.03);
    g.gain.setValueAtTime(0.09,mt+note.d-0.05);
    g.gain.linearRampToValueAtTime(0,mt+note.d);
    o.connect(g);g.connect(c.destination);
    o.start(mt);o.stop(mt+note.d+0.05);
    musicNodes.push(o);
    mt+=note.d;
  });

  // --- Percussion (kick + snare via noise) ---
  const kicks=[0,beat*2,beat*4,beat*6,beat*8,beat*10,beat*12,beat*14];
  kicks.forEach(t=>{
    try{
      const buf=c.createBuffer(1,c.sampleRate*.1,c.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(c.sampleRate*.04));
      const s=c.createBufferSource(),g=c.createGain();
      s.buffer=buf;g.gain.value=0.25;
      s.connect(g);g.connect(c.destination);
      s.start(now+t);musicNodes.push(s);
    }catch(e){}
  });
  const snares=[beat,beat*3,beat*5,beat*7,beat*9,beat*11,beat*13,beat*15];
  snares.forEach(t=>{
    try{
      const buf=c.createBuffer(1,c.sampleRate*.08,c.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(c.sampleRate*.02));
      const s=c.createBufferSource(),g=c.createGain();
      s.buffer=buf;g.gain.value=0.15;
      s.connect(g);g.connect(c.destination);
      s.start(now+beat+t);musicNodes.push(s);
    }catch(e){}
  });

  // --- Schedule next loop ---
  setTimeout(()=>{
    if(musicOn){
      musicNodes=musicNodes.filter(n=>{try{return n.context&&n.context.state!=='closed';}catch(e){return false;}});
      scheduleMusicLoop();
    }
  },(len-0.5)*1000);
}

// SFX
function noise(dur,vol=.15,decay=.04){
  try{const c=ac(),len=c.sampleRate*dur,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(c.sampleRate*decay));
  const s=c.createBufferSource(),g=c.createGain();g.gain.value=vol;
  s.buffer=b;s.connect(g);g.connect(c.destination);s.start();}catch(e){}
}
function tone(freq,type,dur,vol=.15,fe=null){
  try{const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;
  if(fe)o.frequency.linearRampToValueAtTime(fe,c.currentTime+dur);
  g.gain.setValueAtTime(vol,c.currentTime);g.gain.linearRampToValueAtTime(0,c.currentTime+dur);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur+.01);}catch(e){}
}
function sndSword(){noise(.13,.18,.025);if(Math.random()<.4)tone(800+Math.random()*400,'square',.04,.05)}
function sndSpear(){noise(.1,.14,.02);tone(600,'sawtooth',.06,.06)}
function sndArrow(){tone(1400,'sine',.09,.09,350)}
function sndHooves(){noise(.3,.2,.05)}
function sndWarcry(){tone(300+Math.random()*60,'sawtooth',.15,.12)}
function sndHorseneigh(){tone(600,'sawtooth',.35,.18,500)}
function sndMagicZap(){tone(1800,'sine',.4,.22,200);noise(.15,.1,.08)}
function sndMagicAoE(){[300,600,900,1200].forEach((f,i)=>{
  try{const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,c.currentTime+i*.05);
  g.gain.linearRampToValueAtTime(.15,c.currentTime+i*.05+.05);
  g.gain.linearRampToValueAtTime(0,c.currentTime+i*.05+.3);
  o.connect(g);g.connect(c.destination);
  o.start(c.currentTime+i*.05);o.stop(c.currentTime+i*.05+.35);}catch(e){}});
}
function sndRally(){[523,659,784].forEach((f,i)=>{
  try{const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type='triangle';o.frequency.value=f;const t=c.currentTime+i*.15;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.05);g.gain.linearRampToValueAtTime(0,t+.2);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.22);}catch(e){}});
}
function sndFlee(){tone(700,'sawtooth',.6,.18,200)}
function sndFanfare(v){
  const n=v?[523,659,784,1047,1319]:[440,415,392,370,349];
  n.forEach((f,i)=>{try{const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type='triangle';o.frequency.value=f;const t=c.currentTime+i*.2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.04);g.gain.linearRampToValueAtTime(0,t+.22);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.24);}catch(e){}});
}
function sndSelect(){tone(880,'sine',.07,.07)}
function sndShieldBash(){noise(.2,.2,.06);tone(200,'square',.15,.1)}
function sndBerserker(){noise(.1,.25,.02);sndWarcry()}
function sndCastBegin(){tone(1200,'sine',.12,.12,800)}

// ═══════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const cvWrap=document.getElementById('cv-wrap');
function resizeCanvas(){canvas.width=cvWrap.clientWidth;canvas.height=cvWrap.clientHeight;}
resizeCanvas();new ResizeObserver(resizeCanvas).observe(cvWrap);

// ═══════════════════════════════════════════
// UNIT TYPES

// ═══════════════════════════════════════════
// LOGGING
// ═══════════════════════════════════════════
function addLog(msg,cls=''){
  logLines.unshift({msg,cls});if(logLines.length>60)logLines.pop();
  document.getElementById('log-inner').innerHTML=
    logLines.slice(0,30).map(l=>`<div class="log-e ${l.cls}">${l.msg}</div>`).join('');
}

// ═══════════════════════════════════════════
function hasSkill(id){return acquiredSkills.includes(id)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function normAng(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy)}

// ═══════════════════════════════════════════
// UNIT CLASS
// ═══════════════════════════════════════════
class Unit{
  constructor(type,side,x,y,isLord=false){
    this.id=_uid++;this.type=type;this.side=side;this.isLord=isLord;
    const T=isLord?type:TYPES[type];
    this.name=T.name;this.icon=T.icon||'⚔';this.r=T.r;
    this.baseSpd=T.spd||T.speed||60;this.speed=this.baseSpd;
    this.maxHp=T.maxHp||T.hp||2000;this.hp=this.maxHp;
    this.maxCnt=T.maxCnt||T.maxCount||1;this.count=this.maxCnt;
    this.atk=T.atk||T.attack||15;this.baseAtk=this.atk;
    this.def=T.def||T.defense||8;this.baseDef=this.def;
    this.rng=T.rng||T.range||0;this.morDmg=T.mor||T.moraleDmg||5;
    this.desc=T.desc||'';
    this.morale=100+(hasSkill('iron_will')?20:0);
    this.maxMorale=this.morale;
    this.x=x;this.y=y;this.tx=x;this.ty=y;
    this.state='idle';this.target=null;this.meleeWith=null;
    this.inMelee=false;this.fleeing=false;this.dead=false;this.selected=false;
    this.chargeDist=0;this.chargeBonus=0;this.chargeUsed=false;
    this.meleeCd=0;this.shootCd=0;this.flashT=0;this.shakeT=0;
    this.fleeDir=side==='player'?-1:1;
    this.stunT=0;this.undyingUsed=false;this.rallyBonus=0;this.rallyT=0;
    this.colorOverride=isLord?(side==='player'?LORDS[selectedLordType].color:'#cc4444'):null;
    // Queued spell cast (for approach-then-cast)
    this.pendingSpell=null; // {spell,tx,ty,targetUnit}
  }
  get hpPct(){return Math.max(0,this.hp/this.maxHp)}
  get morPct(){return Math.max(0,this.morale/this.maxMorale)}
  dist(u){return dist2(this.x,this.y,u.x,u.y)}
  angle(u){return Math.atan2(u.y-this.y,u.x-this.x)}

  orderMove(tx,ty){
    if(this.fleeing||this.dead)return;
    this.tx=tx;this.ty=ty;this.target=null;this.inMelee=false;this.meleeWith=null;
    this.state='moving';this.pendingSpell=null;
  }
  orderAttack(e){
    if(this.fleeing||this.dead||!e||e.dead)return;
    this.target=e;this.inMelee=false;this.meleeWith=null;
    this.chargeUsed=false;this.chargeDist=0;this.state='moving';
    this.pendingSpell=null;
  }

  takeDmg(dmg){
    if(this.dead)return;
    this.hp=Math.max(0,this.hp-dmg);
    this.count=Math.max(0,Math.ceil((this.hp/this.maxHp)*this.maxCnt));
    this.flashT=.14;
    if(this.hp<=0){
      if(hasSkill('undying')&&this.side==='player'&&!this.undyingUsed&&!this.isLord){
        this.hp=1;this.undyingUsed=true;this.count=1;
        addLog(`${this.icon} ${this.name} survives by sheer will!`,'imp');
      }else this.die();
    }
  }
  takeMorale(dmg){
    this.morale=Math.max(0,this.morale-dmg);this.shakeT=.25;
    if(this.morale<=0&&!this.fleeing)this.rout();
  }
  die(){this.dead=true;this.selected=false;spawnParts(this.x,this.y,this.side==='player'?'#3a7abf':'#bf3a3a',20);}
  rout(){
    this.fleeing=true;this.state='fleeing';this.inMelee=false;this.meleeWith=null;this.target=null;
    sndFlee();addLog(`${this.icon} ${this.name} (${this.side==='player'?'Blue':'Red'}) FLEES!`,this.side==='player'?'bad':'good');
  }

  update(dt,all){
    if(this.dead)return;
    this.flashT=Math.max(0,this.flashT-dt);this.shakeT=Math.max(0,this.shakeT-dt);
    this.meleeCd=Math.max(0,this.meleeCd-dt);this.shootCd=Math.max(0,this.shootCd-dt);
    this.stunT=Math.max(0,this.stunT-dt);
    if(this.rallyT>0){this.rallyT-=dt;if(this.rallyT<=0){this.rallyBonus=0;}}

    if(this.fleeing){
      this.x+=this.fleeDir*this.baseSpd*1.5*dt;
      this.y+=(Math.random()-.5)*30*dt;
      this.y=clamp(this.y,this.r,canvas.height-this.r);
      const rr=hasSkill('war_drums')?6:2;
      this.morale=Math.min(this.maxMorale,this.morale+rr*dt);
      if(this.morale>40){this.fleeing=false;this.state='idle';}
      if(this.x<-150||this.x>canvas.width+150)this.dead=true;
      return;
    }
    if(this.morale<this.maxMorale)this.morale=Math.min(this.maxMorale,this.morale+2*dt);
    if(this.stunT>0)return;

    const ens=all.filter(u=>u.side!==this.side&&!u.dead&&!u.fleeing);
    const frs=all.filter(u=>u.side===this.side&&!u.dead&&u!==this);

    // Handle pending spell approach
    if(this.pendingSpell&&this.isLord&&this.side==='player'){
      const ps=this.pendingSpell;
      const spellRng=ps.spell.rng;
      let tx=ps.tx,ty=ps.ty;
      if(ps.targetUnit){tx=ps.targetUnit.x;ty=ps.targetUnit.y;}
      const d=dist2(this.x,this.y,tx,ty);
      if(d<=spellRng){
        // In range — cast it
        executeCast(ps.spell,tx,ty,ps.targetUnit);
        this.pendingSpell=null;this.state='idle';
      }else{
        this._move(tx,ty,dt,frs);return;
      }
      return;
    }

    if(this.inMelee){
      if(!this.meleeWith||this.meleeWith.dead||this.meleeWith.fleeing){
        this.inMelee=false;this.meleeWith=null;this.state='idle';
      }else{this._melee(dt);return;}
    }
    if(this.target&&(this.target.dead||this.target.fleeing)){this.target=null;this.state='idle';}

    if((this.type==='ARCHER'||this.type==='CROSSBOW'||this.type==='HORSE_ARCHER')&&this.target&&!this.inMelee){
      if(this.dist(this.target)<=this.rng){this._ranged();return;}
    }
    if(this.target){
      const d=this.dist(this.target),eng=this.r+this.target.r+4;
      if(d<=eng)this._engage(this.target);
      else{
        if(this.type==='CAVALRY'&&!this.chargeUsed)this.chargeDist+=this.speed*dt;
        this._move(this.target.x,this.target.y,dt,frs);
      }
      return;
    }
    if(this.state==='moving'){
      const dx=this.tx-this.x,dy=this.ty-this.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<5)this.state='idle';else this._move(this.tx,this.ty,dt,frs);
    }
  }

  _move(tx,ty,dt,frs){
    const dx=tx-this.x,dy=ty-this.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    let nx=dx/d,ny=dy/d;
    frs.forEach(f=>{
      const fd=this.dist(f),mn=this.r+f.r+2;
      if(fd<mn&&fd>.1){const w=(mn-fd)/mn*.6;nx+=(this.x-f.x)/fd*w;ny+=(this.y-f.y)/fd*w;}
    });
    const len=Math.sqrt(nx*nx+ny*ny)||1;
    this.x+=nx/len*this.speed*dt;this.y+=ny/len*this.speed*dt;
    this.x=clamp(this.x,this.r,canvas.width-this.r);
    this.y=clamp(this.y,this.r,canvas.height-this.r);
  }

  _engage(e){
    this.inMelee=true;this.meleeWith=e;this.state='melee';
    if(!e.inMelee){e.inMelee=true;e.meleeWith=this;e.state='melee';e.target=this;}
    if(this.type==='CAVALRY'&&!this.chargeUsed){
      let bonus=Math.min(50,this.chargeDist*.08);
      if(hasSkill('swift_hooves'))bonus*=1.2;
      if(hasSkill('cavalry_wedge'))bonus*=1.15;
      this.chargeBonus=bonus;this.chargeUsed=true;this.chargeDist=0;
      spawnParts(this.x,this.y,'#ffaa00',20);sndHorseneigh();
      if(bonus>8)addLog(`🐴 Cavalry CHARGE! (+${Math.round(bonus)} dmg)`,'imp');
    }
  }

  _melee(dt){
    if(this.meleeCd>0)return;
    const e=this.meleeWith;
    let atk=this.atk+(this.rallyBonus||0),def=e.def;
    if(hasSkill('steel_edge')&&this.side==='player'&&['INFANTRY','BERSERKER','SHIELDWALL','PIKEMAN'].includes(this.type))atk*=1.25;
    if(hasSkill('blood_rage')&&this.type==='BERSERKER'&&this.hpPct<.5)atk*=1.4;
    if(hasSkill('shield_bash')&&this.type==='SHIELDWALL'&&Math.random()<.12){
      e.stunT=1.2;spawnParts(e.x,e.y,'#ffffff',8);sndShieldBash();
      addLog(`🛡 Shield Bash stuns!`,'imp');
    }
    if(isBerserk&&this.isLord&&this.side==='player')atk*=2;
    if(this.type==='INFANTRY'&&e.type==='SPEARMAN')atk*=1.35;
    if((this.type==='SPEARMAN'||this.type==='PIKEMAN')&&e.type==='CAVALRY'){atk*=2.8;def*=.5;}
    if(this.type==='CAVALRY'&&(e.type==='SPEARMAN'||e.type==='PIKEMAN')){atk*=.3;def*=1.6;}
    if(this.type==='CAVALRY'&&e.type==='ARCHER')atk*=2.2;
    if(this.type==='BERSERKER')atk*=1.2;
    if(e.type==='ARCHER'||e.type==='CROSSBOW')def*=.25;
    if(e.type==='SHIELDWALL')def*=1.4;
    let fl=1;
    if(this.type==='CAVALRY'){
      const ang=this.angle(e),facing=e.side==='player'?0:Math.PI;
      const diff=Math.abs(normAng(ang-facing));
      if(diff>Math.PI*.65)fl=1.7;else if(diff>Math.PI*.3)fl=1.3;
    }
    let chg=0;if(this.chargeBonus>0){chg=this.chargeBonus;this.chargeBonus=0;}
    const dmg=Math.max(.5,atk*fl-def*.45+Math.random()*4+chg);
    const mor=(this.morDmg*fl+(chg>0?8:0))*.4;
    e.takeDmg(dmg);e.takeMorale(mor);
    if(Math.random()<.08){
      if(this.type==='CAVALRY')sndHooves();
      else if(this.type==='BERSERKER')sndBerserker();
      else if(this.type==='SHIELDWALL')sndShieldBash();
      else if(this.type==='SPEARMAN'||this.type==='PIKEMAN')sndSpear();
      else sndSword();
      spawnParts(e.x,e.y,'#ffcc44',4);
    }
    this.meleeCd=.16+Math.random()*.08;
  }

  _ranged(){
    if(this.shootCd>0)return;
    const e=this.target;if(!e||e.dead||e.fleeing){this.state='idle';return;}
    if(this.dist(e)>this.rng){this.state='moving';return;}
    let dmg=this.atk*(.85+Math.random()*.4);
    if(hasSkill('eagle_eye')&&this.side==='player'&&(this.type==='ARCHER'||this.type==='CROSSBOW'))dmg*=1.3;
    projectiles.push(new Proj(this.x,this.y,e,dmg,this.type==='CROSSBOW'));
    let cd=this.type==='CROSSBOW'?2.0:1.2;
    if(hasSkill('rapid_volley')&&this.side==='player')cd*=.6;
    this.shootCd=cd+Math.random()*.4;sndArrow();
  }

  aiPick(ens){
    if(!ens.length)return;
    let best=null,bs=-Infinity;
    ens.forEach(e=>{
      let s=-this.dist(e)*.4;
      if(e.type==='ARCHER'||e.type==='CROSSBOW')s+=180;
      if(e.hpPct<.4)s+=90;
      if((this.type==='SPEARMAN'||this.type==='PIKEMAN')&&e.type==='CAVALRY')s+=220;
      if(this.type==='CAVALRY'&&(e.type==='ARCHER'||e.type==='CROSSBOW'))s+=200;
      if(e.isLord)s+=150;
      if(s>bs){bs=s;best=e;}
    });
    this.orderAttack(best);
  }
}

// ═══════════════════════════════════════════
// PROJECTILE
// ═══════════════════════════════════════════
class Proj{
  constructor(x,y,tgt,dmg,isBolt=false){
    this.x=x;this.y=y;this.tgt=tgt;this.dmg=dmg;this.isBolt=isBolt;this.dead=false;
    const dx=tgt.x-x,dy=tgt.y-y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const spd=isBolt?380:320;this.vx=dx/d*spd;this.vy=dy/d*spd;
  }
  update(dt){
    if(this.dead)return;
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(!this.tgt.dead){
      if(dist2(this.x,this.y,this.tgt.x,this.tgt.y)<this.tgt.r){
        this.tgt.takeDmg(this.dmg);this.tgt.takeMorale(2.5);
        spawnParts(this.x,this.y,'#ff7733',4);this.dead=true;
      }
    }else this.dead=true;
    if(this.x<-20||this.x>canvas.width+20||this.y<-20||this.y>canvas.height+20)this.dead=true;
  }
  draw(){
    if(this.dead)return;
    ctx.save();ctx.shadowColor=this.isBolt?'#ff8800':'#ffcc44';ctx.shadowBlur=7;
    ctx.beginPath();ctx.arc(this.x,this.y,this.isBolt?4:3,0,Math.PI*2);
    ctx.fillStyle=this.isBolt?'#ff8800':'#ffe066';ctx.fill();ctx.restore();
  }
}

// PARTICLES
// ═══════════════════════════════════════════
function spawnParts(x,y,col,n){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*110,vy:(Math.random()-.5)*110,
    life:.35+Math.random()*.3,maxL:.65,col,sz:2+Math.random()*3});
}
function spawnMagic(x,y,col,n){
  for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,spd=30+Math.random()*80;
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      life:.5+Math.random()*.4,maxL:.9,col,sz:3+Math.random()*4,glow:true});}
}
function tickParts(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParts(){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.maxL);
    if(p.glow){ctx.shadowColor=p.col;ctx.shadowBlur=8;}
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();ctx.restore();
  });
}
let aoeEffects=[];
function spawnAoERing(x,y,radius,col){aoeEffects.push({x,y,radius,col,life:.7,maxL:.7});}
function tickAoE(dt){for(let i=aoeEffects.length-1;i>=0;i--){aoeEffects[i].life-=dt;if(aoeEffects[i].life<=0)aoeEffects.splice(i,1);}}
function drawAoE(){
  aoeEffects.forEach(a=>{
    const al=Math.max(0,a.life/a.maxL),r=a.radius*(1-a.life/a.maxL);
    ctx.save();ctx.globalAlpha=al*.6;
    ctx.beginPath();ctx.arc(a.x,a.y,r,0,Math.PI*2);
    ctx.strokeStyle=a.col;ctx.lineWidth=3+al*5;ctx.stroke();
    ctx.globalAlpha=al*.12;ctx.fillStyle=a.col;ctx.fill();ctx.restore();
  });
}

// ═══════════════════════════════════════════
// TERRAIN
// ═══════════════════════════════════════════
let terrain=[];
function genTerrain(){
  terrain=[];const W=canvas.width,H=canvas.height;
  const nh=2+Math.floor(Math.random()*3);
  for(let i=0;i<nh;i++)terrain.push({type:'hill',
    x:180+Math.random()*(W-360),y:50+Math.random()*(H-100),
    rx:50+Math.random()*55,ry:28+Math.random()*28});
  if(Math.random()<.4)terrain.push({type:'river',x:W*.38+Math.random()*W*.24,w:16,col:'#1a2e40'});
}
function drawTerrain(){
  terrain.forEach(t=>{
    ctx.save();
    if(t.type==='hill'){
      const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,t.rx);
      g.addColorStop(0,'#354428');g.addColorStop(1,'#1c2a12');
      ctx.beginPath();ctx.ellipse(t.x,t.y,t.rx,t.ry,0,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#263318';ctx.lineWidth=1;ctx.stroke();
    }else{
      ctx.fillStyle=t.col||'#1a2e40';ctx.fillRect(t.x,0,t.w,canvas.height);
    }
    ctx.restore();
  });
}

// ═══════════════════════════════════════════
// SPELL EXECUTION
// ═══════════════════════════════════════════
function executeCast(spell,tx,ty,targetUnit){
  const magMult=(hasSkill('arcane_surge')&&selectedLordType==='MAGE')?1.35:1;
  const ens=units.filter(u=>u.side==='ai'&&!u.dead&&!u.fleeing);
  const frs=units.filter(u=>u.side==='player'&&!u.dead&&!u.fleeing);

  if(spell.id==='fireball'){
    const r=spell.aoe;sndMagicAoE();spawnAoERing(tx,ty,r,'#ff6600');spawnMagic(tx,ty,'#ff6600',35);
    ens.forEach(e=>{const d=dist2(e.x,e.y,tx,ty);if(d<r){e.takeDmg((spell.dmg-d*.7)*magMult);e.takeMorale(spell.morDmg);}});
    addLog(`🔥 Fireball!`,'magic');
  }
  else if(spell.id==='blizzard'){
    const r=spell.aoe;sndMagicZap();spawnAoERing(tx,ty,r,'#88ddff');spawnMagic(tx,ty,'#88ddff',28);
    ens.forEach(e=>{const d=dist2(e.x,e.y,tx,ty);if(d<r){
      e.takeDmg(spell.dmg*magMult);e.takeMorale(spell.morDmg);
      e.speed=e.baseSpd*.4;setTimeout(()=>{if(!e.dead)e.speed=e.baseSpd;},4500);
    }});
    addLog(`❄ Blizzard slows enemies!`,'magic');
  }
  else if(spell.id==='chain_bolt'){
    let tgts=[],cur=ens.sort((a,b)=>dist2(playerLord.x,playerLord.y,a.x,a.y)-dist2(playerLord.x,playerLord.y,b.x,b.y))[0];
    for(let i=0;i<4&&cur;i++){
      tgts.push(cur);cur.takeDmg(spell.dmg*magMult);cur.takeMorale(spell.morDmg);
      spawnMagic(cur.x,cur.y,'#ffff44',15);
      const next=ens.filter(e=>!tgts.includes(e)&&!e.dead).sort((a,b)=>cur.dist(a)-cur.dist(b))[0];cur=next;
    }
    sndMagicZap();addLog(`⚡ Chain Bolt hits ${tgts.length} enemies!`,'magic');
  }
  else if(spell.id==='haste'){
    const tgt=targetUnit;if(!tgt||tgt.dead)return;
    tgt.speed=tgt.baseSpd*1.6;spawnMagic(tgt.x,tgt.y,'#44ffaa',20);
    sndRally();addLog(`💨 Haste on ${tgt.name}!`,'magic');
    setTimeout(()=>{if(!tgt.dead)tgt.speed=tgt.baseSpd;},6000);
  }
  else if(spell.id==='shield_aura'){
    const r=spell.aoe;spawnAoERing(tx,ty,r,'#4488ff');
    frs.forEach(u=>{if(dist2(u.x,u.y,tx,ty)<r){
      u.def=u.baseDef+8;spawnMagic(u.x,u.y,'#4488ff',8);
      setTimeout(()=>{if(!u.dead)u.def=u.baseDef;},7000);
    }});
    sndMagicZap();addLog(`🔵 Arcane Shield cast!`,'magic');
  }
  else if(spell.id==='warcry'){
    const r=spell.aoe;sndRally();spawnAoERing(tx,ty,r,'#ffaa00');
    frs.forEach(u=>{if(dist2(u.x,u.y,tx,ty)<r){
      u.morale=Math.min(u.maxMorale,u.morale+35);u.rallyBonus=8;u.rallyT=8;
      if(u.fleeing){u.fleeing=false;u.state='idle';}spawnMagic(u.x,u.y,'#ffaa00',8);
    }});
    addLog(`📣 War Cry rallies allies!`,'imp');
  }
  else if(spell.id==='shockwave'){
    const r=spell.aoe;sndShieldBash();noise(.3,.25,.06);spawnAoERing(tx,ty,r,'#cc8800');
    ens.forEach(e=>{const d=dist2(e.x,e.y,tx,ty);if(d<r){
      e.takeDmg(spell.dmg);e.takeMorale(spell.morDmg);e.stunT=2.5;
      const ang=Math.atan2(e.y-ty,e.x-tx);e.x+=Math.cos(ang)*60;e.y+=Math.sin(ang)*60;
      spawnParts(e.x,e.y,'#cc8800',10);
    }});
    addLog(`💥 Shockwave stuns enemies!`,'imp');
  }
  else if(spell.id==='berserk'){
    isBerserk=true;berserkTimer=6;
    if(playerLord)playerLord.speed=playerLord.baseSpd*2;
    spawnMagic(playerLord.x,playerLord.y,'#ff4400',30);sndBerserker();
    addLog(`💢 BERSERK MODE!`,'imp');
  }
  else if(spell.id==='taunt'){
    const r=spell.aoe;sndWarcry();spawnAoERing(tx,ty,r,'#ff8800');
    ens.forEach(e=>{if(dist2(e.x,e.y,tx,ty)<r){e.takeMorale(spell.morDmg);spawnParts(e.x,e.y,'#ff8800',8);}});
    addLog(`😤 Battle Taunt breaks enemy morale!`,'imp');
  }
  else if(spell.id==='bloodlust'){
    const r=spell.aoe;spawnAoERing(tx,ty,r,'#cc2200');sndBerserker();
    frs.forEach(u=>{if(dist2(u.x,u.y,tx,ty)<r){
      u.atk=u.baseAtk*1.5;u.def=u.baseDef*.7;
      spawnMagic(u.x,u.y,'#cc2200',10);
      setTimeout(()=>{if(!u.dead){u.atk=u.baseAtk;u.def=u.baseDef;}},8000);
    }});
    addLog(`🩸 Bloodlust! Allies gain +50% attack!`,'imp');
  }
}

// ═══════════════════════════════════════════
// SPELL TARGETING FLOW
// ═══════════════════════════════════════════
function beginCast(spellIdx){
  if(!playerLord||playerLord.dead)return;
  if(spellCooldowns[spellIdx]>0)return;
  const LDef=LORDS[selectedLordType];
  const spell=LDef.spells[spellIdx];
  castingSpell={spell,idx:spellIdx};
  sndCastBegin();
  // Self-cast: instant
  if(spell.target==='self'){
    executeCast(spell,playerLord.x,playerLord.y,playerLord);
    spellCooldowns[spellIdx]=spell.cd;
    castingSpell=null;
    updateSpellBar();return;
  }
  addLog(`${spell.ico} Targeting ${spell.name}... click a ${spell.target==='ally'?'friendly':'enemy'} unit or location`,'magic');
  updateSpellBar();
}

function finishCast(mx,my){
  if(!castingSpell)return;
  const spell=castingSpell.spell;
  const idx=castingSpell.idx;
  let targetUnit=null;

  if(spell.target==='ally'){
    targetUnit=units.find(u=>u.side==='player'&&!u.dead&&dist2(u.x,u.y,mx,my)<u.r+12);
  }else if(spell.target==='enemy'){
    targetUnit=units.find(u=>u.side==='ai'&&!u.dead&&dist2(u.x,u.y,mx,my)<u.r+12);
  }

  const tx=targetUnit?targetUnit.x:mx;
  const ty=targetUnit?targetUnit.y:my;
  const dToTarget=dist2(playerLord.x,playerLord.y,tx,ty);

  if(dToTarget<=spell.rng){
    // In range — cast immediately
    executeCast(spell,tx,ty,targetUnit);
    spellCooldowns[idx]=spell.cd;
  }else{
    // Out of range — move lord then cast
    addLog(`${spell.ico} ${spell.name}: approaching target...`,'magic');
    playerLord.pendingSpell={spell,idx,tx,ty,targetUnit};
    playerLord.state='moving';
    // Store idx in pendingSpell so we can set CD after
    playerLord.pendingSpell.idx=idx;
  }
  castingSpell=null;
  updateSpellBar();
}

// Patch Unit.update to set CD after approach-cast
const _origUpdate=Unit.prototype.update;
Unit.prototype.update=function(dt,all){
  // Check if we just finished approach cast
  if(this.pendingSpell&&this.isLord){
    const ps=this.pendingSpell;
    const tx=ps.targetUnit?ps.targetUnit.x:ps.tx;
    const ty=ps.targetUnit?ps.targetUnit.y:ps.ty;
    if(dist2(this.x,this.y,tx,ty)<=ps.spell.rng){
      executeCast(ps.spell,tx,ty,ps.targetUnit);
      spellCooldowns[ps.idx]=ps.spell.cd;
      this.pendingSpell=null;this.state='idle';
      updateSpellBar();return;
    }
  }
  _origUpdate.call(this,dt,all);
};

// ═══════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════
function setupWave(){
  units=[]; projectiles=[]; particles=[]; aoeEffects=[];
  selectedUnit=null; selectedUnits=[]; endChecked=false; _uid=0;
  isBerserk=false; berserkTimer=0; spellCooldowns=[0,0,0,0,0];
  castingSpell=null; dragStart=null; dragRect=null; isDragging=false;

  const W=canvas.width, H=canvas.height;
  const wave=WAVES[currentWave];

  const pf=[
    {t:'SPEARMAN', x:85,  y:H*.20},{t:'INFANTRY', x:85,  y:H*.33},
    {t:'INFANTRY', x:85,  y:H*.46},{t:'SPEARMAN', x:85,  y:H*.59},
    {t:'SHIELDWALL',x:80, y:H*.72},{t:'ARCHER',   x:48,  y:H*.27},
    {t:'ARCHER',   x:48,  y:H*.55},{t:'CROSSBOW', x:48,  y:H*.68},
    {t:'CAVALRY',  x:110, y:H*.10},{t:'CAVALRY',  x:110, y:H*.88},
    {t:'BERSERKER',x:88,  y:H*.40},
  ];
  pf.forEach(d=>units.push(new Unit(d.t,'player',d.x,d.y)));

  // Player lord
  const LDef=LORDS[selectedLordType];
  const ld={name:LDef.name,icon:LDef.icon,r:LDef.r,spd:LDef.spd,
    maxHp:LDef.hp,hp:LDef.hp,maxCnt:1,atk:LDef.atk,def:LDef.def,
    rng:0,mor:8,desc:LDef.title};
  playerLord=new Unit(ld,'player',120,H*.5,true);
  units.push(playerLord);

  // Enemies
  const scl=1+currentWave*.18;
  const eSlots=[];
  wave.enemies.forEach(ed=>{for(let i=0;i<ed.n;i++)eSlots.push(ed.t);});
  eSlots.forEach((t,idx)=>{
    const u=new Unit(t,'ai',
      clamp(W-80-Math.floor(idx/4)*55,W*.6,W-50),
      clamp(H*.1+idx*(H*.8/Math.max(eSlots.length,1)),30,H-30));
    u.maxHp=Math.round(u.maxHp*scl);u.hp=u.maxHp;u.atk=Math.round(u.atk*scl);
    units.push(u);
  });

  // Enemy lord (wave 2+)
  if(currentWave>=1){
    const elType=currentWave%2===0?'WARRIOR':'MAGE';
    const EL=LORDS[elType];
    const eld={name:EL.name,icon:EL.icon,r:EL.r,spd:EL.spd,
      maxHp:Math.round(EL.hp*scl),hp:Math.round(EL.hp*scl),maxCnt:1,
      atk:Math.round(EL.atk*scl),def:EL.def,rng:elType==='MAGE'?220:0,mor:10,desc:EL.title};
    const el=new Unit(eld,'ai',W-100,H*.5,true);
    el.colorOverride='#cc4444';units.push(el);
  }

  updateLevelBadge();updateSpellBar();updateSidebar(true);
  addLog(`⚔ Wave ${currentWave+1}: ${wave.name}`,'imp');
}

function updateLevelBadge(){
  const w=WAVES[Math.min(currentWave,WAVES.length-1)];
  document.getElementById('level-badge').textContent=`Wave ${currentWave+1} — ${w.name}`;
}

// ═══════════════════════════════════════════
// SPELL BAR UI (left bottom)
// ═══════════════════════════════════════════
function updateSpellBar(){
  const LDef=LORDS[selectedLordType];
  const bar=document.getElementById('spell-bar');
  bar.innerHTML='';

  // Lord portrait icon
  document.getElementById('lord-portrait-ico').textContent=LDef.icon;
  document.getElementById('lord-name-label').textContent=LDef.name;
  document.getElementById('lord-portrait-frame').className=isBerserk?'berserk':'';
  if(playerLord&&!playerLord.dead){
    document.getElementById('lord-hp-fill').style.width=(playerLord.hpPct*100)+'%';
  }

  LDef.spells.forEach((sp,i)=>{
    const cd=spellCooldowns[i];
    const isCasting=castingSpell&&castingSpell.idx===i;
    const isReady=cd<=0;
    const btn=document.createElement('div');
    btn.className='spell-btn'+(isCasting?' casting':(isReady?(selectedLordType==='MAGE'?' ready':' melee-ready'):''));
    btn.title=`${sp.name}: ${sp.desc}`;
    btn.innerHTML=`
      <span class="spell-ico">${sp.ico}</span>
      <span class="spell-key">${sp.key}</span>
      <span class="spell-name-label">${sp.name}</span>
      ${cd>0?`<div class="spell-cd-overlay">${Math.ceil(cd)}</div>`:''}
    `;
    btn.addEventListener('click',()=>{ac();beginCast(i);});
    bar.appendChild(btn);
  });
}

// ═══════════════════════════════════════════
// ABILITY COOLDOWN TICK
// ═══════════════════════════════════════════
function tickCooldowns(dt){
  let changed=false;
  spellCooldowns=spellCooldowns.map(c=>{const n=Math.max(0,c-dt);if(n!==c)changed=true;return n;});
  if(berserkTimer>0){berserkTimer-=dt;if(berserkTimer<=0){isBerserk=false;if(playerLord&&!playerLord.dead)playerLord.speed=playerLord.baseSpd;}}
  if(changed)updateSpellBar();
}

// ═══════════════════════════════════════════
// AI
// ═══════════════════════════════════════════
function updateAI(dt){
  if(gameState!==GS.BATTLE)return;
  aiTimer-=dt;if(aiTimer>0)return;aiTimer=1.0+Math.random()*.8;
  const aiU=units.filter(u=>u.side==='ai'&&!u.dead&&!u.fleeing);
  const plU=units.filter(u=>u.side==='player'&&!u.dead&&!u.fleeing);
  if(!plU.length)return;
  aiU.forEach(u=>{if(!u.inMelee)u.aiPick(plU);});
  // Enemy lord spell
  const eLord=units.find(u=>u.isLord&&u.side==='ai'&&!u.dead);
  if(eLord&&Math.random()<.025){
    const near=plU.sort((a,b)=>eLord.dist(a)-eLord.dist(b))[0];
    if(near&&eLord.dist(near)<260){
      plU.forEach(e=>{if(eLord.dist(e)<130){e.takeDmg(70);e.takeMorale(10);}});
      spawnAoERing(eLord.x,eLord.y,130,'#cc4444');
      spawnMagic(eLord.x,eLord.y,'#cc4444',15);sndMagicZap();
      addLog(`Enemy Lord strikes!`,'bad');
    }
  }
}

// ═══════════════════════════════════════════
// VICTORY CHECK
// ═══════════════════════════════════════════
function checkEnd(){
  if(gameState!==GS.BATTLE||endChecked)return;
  const alive=s=>units.filter(u=>u.side===s&&!u.dead&&!u.fleeing);
  if(!alive('ai').length){endChecked=true;endGame(true);}
  else if(!alive('player').length){endChecked=true;endGame(false);}
}
function endGame(victory){
  gameState=GS.END;castingSpell=null;sndFanfare(victory);
  document.getElementById('ov-title').textContent=victory?'⚔  VICTORY  ⚔':'☠  DEFEAT  ☠';
  document.getElementById('ov-title').style.color=victory?'#d4a32a':'#e04040';
  document.getElementById('ov-sub').textContent=victory?`Wave ${currentWave+1} cleared!`:'Your forces are destroyed.';
  document.getElementById('end-overlay').classList.add('show');
  document.getElementById('btnContinue').style.display=victory?'':'none';
  document.getElementById('btnRestart').style.display='';
  addLog(victory?`★ Wave ${currentWave+1} CLEARED!`:'✗ DEFEAT.',victory?'good':'bad');
}

// ═══════════════════════════════════════════
// LEVEL UP
// ═══════════════════════════════════════════
function showLevelUp(){
  document.getElementById('end-overlay').classList.remove('show');
  document.getElementById('levelup-ov').classList.add('show');
  const pool=SKILL_POOL.filter(s=>!acquiredSkills.includes(s.id));
  const picks=[];while(picks.length<3&&pool.length>0)picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  document.getElementById('lu-cards').innerHTML=picks.map(s=>`
    <div class="skill-card" data-id="${s.id}">
      <div class="skill-ico">${s.ico}</div>
      <div class="skill-name">${s.name}</div>
      <div class="skill-desc">${s.desc}</div>
      <div class="skill-cost">Type: ${s.type}</div>
    </div>`).join('');
  document.getElementById('lu-cards').querySelectorAll('.skill-card').forEach(c=>{
    c.addEventListener('click',()=>{
      acquiredSkills.push(c.dataset.id);
      const sk=SKILL_POOL.find(s=>s.id===c.dataset.id)||picks.find(s=>s.id===c.dataset.id);
      addLog(`✦ Skill: ${sk?sk.name:c.dataset.id}`,'magic');
      closeLevelUp();
    });
  });
}
function closeLevelUp(){
  document.getElementById('levelup-ov').classList.remove('show');
  currentWave=Math.min(currentWave+1,WAVES.length-1);
  gameState=GS.DEPLOY;
  genTerrain();setupWave();
  document.getElementById('btnStart').disabled=false;
  document.getElementById('btnRetreat').disabled=true;
  document.getElementById('btnRestart').style.display='none';
  updateActiveSkillsDisplay();
}
function updateActiveSkillsDisplay(){
  const el=document.getElementById('active-skills-display');
  if(!acquiredSkills.length){el.innerHTML='<span style="color:#444;font-size:9px">None yet</span>';return;}
  el.innerHTML=acquiredSkills.map(id=>{
    const s=SKILL_POOL.find(x=>x.id===id);if(!s)return'';
    return `<span class="skill-tag ${s.type==='magic'?'':'melee'}" title="${s.desc}">${s.ico} ${s.name}</span>`;
  }).join('');
}

// ═══════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════
let _sbT=0;
function updateSidebar(force){

    }else{
      det.innerHTML='<div id="no-sel">No unit selected</div>';

  }else{

    const sC=u.side==='player'?'#4a8aca':'#ca4a4a';
    det.innerHTML=`
      <div style="text-align:center;font-size:24px">${u.icon}</div>
      <div style="text-align:center;font-size:12px;font-weight:bold;color:${sC}">${u.name}${u.isLord?' ✦':''}</div>
      <div style="text-align:center;font-size:9px;color:var(--muted);margin-bottom:5px">${u.desc}</div>
      ${u.fleeing?'<div style="color:#ff4444;text-align:center;font-size:10px">⚡ FLEEING</div>':''}
      ${u.stunT>0?'<div style="color:#ffaa00;text-align:center;font-size:10px">★ STUNNED</div>':''}
      <div class="stat-row"><span class="stat-lbl">Men</span><span class="stat-val">${u.count}/${u.maxCnt}</span></div>
      <div class="mini-bar"><div class="mini-bar-fill" style="width:${u.hpPct*100}%;background:${hC}"></div></div>
      <div class="stat-row"><span class="stat-lbl">Morale</span><span class="stat-val">${Math.round(u.morale)}</span></div>
      <div class="mini-bar"><div class="mini-bar-fill" style="width:${u.morPct*100}%;background:${mC}"></div></div>
      <div class="stat-row"><span class="stat-lbl">Atk</span><span class="stat-val">${u.atk}</span></div>
      <div class="stat-row"><span class="stat-lbl">Def</span><span class="stat-val">${u.def}</span></div>
      <div class="stat-row"><span class="stat-lbl">Spd</span><span class="stat-val">${Math.round(u.speed)}</span></div>
      ${u.rng?`<div class="stat-row"><span class="stat-lbl">Range</span><span class="stat-val">${u.rng}px</span></div>`:''}
      <div class="stat-row"><span class="stat-lbl">State</span><span class="stat-val" style="text-transform:capitalize">${u.state}</span></div>
    `;
  }

  const wrap=document.getElementById('unit-list-wrap');
  const pu=units.filter(u=>u.side==='player'&&!u.dead);
  if(!pu.length){wrap.innerHTML='<div style="color:#444;font-size:10px;text-align:center;padding:8px">All units lost</div>';return;}
  wrap.innerHTML=pu.map(u=>`
    <div class="ucard ${u===selectedUnit?'sel':''} ${u.fleeing?'flee':''} ${selectedUnits.includes(u)&&u!==selectedUnit?'multi-sel':''}" data-id="${u.id}">
      <div class="ucard-head">
        <span class="ucard-ico">${u.icon}</span>
        <span class="ucard-name">${u.name}${u.isLord?' ✦':''}</span>
        <span class="ucard-mini">${u.maxCnt>1?u.count+'m':''}</span>
      </div>
      <div class="ucard-mini">HP ${Math.round(u.hpPct*100)}% Mor ${Math.round(u.morale)}
        ${u.fleeing?' <span style="color:#c03030">FLEE</span>':''}
      </div>
    </div>`).join('');
  wrap.querySelectorAll('.ucard').forEach(c=>{
    c.addEventListener('click',()=>{const u=units.find(x=>x.id===+c.dataset.id);if(u)doSelect([u]);});
  });
}
function renderLog(){
  document.getElementById('log-inner').innerHTML=
    logLines.slice(0,30).map(l=>`<div class="log-e ${l.cls}">${l.msg}</div>`).join('');
}
function updatePowerBar(){
  const pw=u=>u.hp+u.morale*1.5+(u.isLord?500:0);
  const bp=units.filter(u=>u.side==='player'&&!u.dead&&!u.fleeing).reduce((s,u)=>s+pw(u),0);
  const rp=units.filter(u=>u.side==='ai'&&!u.dead&&!u.fleeing).reduce((s,u)=>s+pw(u),0);
  const tot=(bp+rp)||1,pct=bp/tot*100;
  document.getElementById('pb-blue').style.width=pct+'%';
  document.getElementById('pb-red').style.width=(100-pct)+'%';
}

// ═══════════════════════════════════════════
// SELECTION
// ═══════════════════════════════════════════
function doSelect(arr){
  units.forEach(u=>u.selected=false);
  selectedUnits=arr||[];
  selectedUnit=arr&&arr.length===1?arr[0]:null;
  selectedUnits.forEach(u=>u.selected=true);
  if(arr&&arr.length===1)sndSelect();
  updateSidebar(true);
}
function doSelectAdd(arr){
  arr.forEach(u=>{if(!selectedUnits.includes(u))selectedUnits.push(u);u.selected=true;});
  selectedUnit=selectedUnits.length===1?selectedUnits[0]:null;
  updateSidebar(true);
}

// ═══════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════
function drawBg(){
  const wave=WAVES[Math.min(currentWave,WAVES.length-1)];
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,wave.bg[0]);g.addColorStop(1,wave.bg[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#ffffff06';ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  ctx.save();ctx.strokeStyle='#ffffff10';ctx.lineWidth=2;ctx.setLineDash([10,12]);
  ctx.beginPath();ctx.moveTo(canvas.width/2,0);ctx.lineTo(canvas.width/2,canvas.height);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}

function drawDeployZones(){
  if(gameState!==GS.DEPLOY)return;
  const W=canvas.width,H=canvas.height,zw=W*.24;
  ctx.fillStyle='#1a4a8a1a';ctx.fillRect(0,0,zw,H);
  ctx.strokeStyle='#3a6aaa44';ctx.lineWidth=2;ctx.setLineDash([8,8]);
  ctx.strokeRect(1,1,zw-2,H-2);ctx.setLineDash([]);
  ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.fillStyle='#4a8aca55';
  ctx.fillText('PLAYER ZONE',zw/2,H/2-8);
  ctx.font='9px Georgia';ctx.fillStyle='#4a8aca33';
  ctx.fillText('RMB to reposition',zw/2,H/2+10);
}

function drawUnit(u){
  const sx=u.shakeT>0?(Math.random()-.5)*5:0,sy=u.shakeT>0?(Math.random()-.5)*5:0;
  const x=u.x+sx,y=u.y+sy,r=u.r;
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.ellipse(0,r*.75,r*.7,r*.22,0,0,Math.PI*2);ctx.fillStyle='#00000055';ctx.fill();
  const isP=u.side==='player';
  const base=u.colorOverride||(isP?'#143c6a':'#6a1414');
  const hi=isP?'#4a8aca':'#ca4a4a';
  const grad=ctx.createRadialGradient(-r*.25,-r*.25,r*.05,0,0,r);
  if(u.colorOverride){grad.addColorStop(0,u.colorOverride+'cc');grad.addColorStop(1,u.colorOverride+'55');}
  else{grad.addColorStop(0,hi);grad.addColorStop(1,base);}
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle=u.flashT>0?`rgba(255,255,255,${u.flashT/.14*.85})`:grad;ctx.fill();
  if(u.isLord){
    ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);
    ctx.strokeStyle=u.colorOverride||'#d4a32a';ctx.lineWidth=2.5;
    ctx.shadowColor=u.colorOverride||'#d4a32a';ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;
  }
  if(isBerserk&&u.isLord&&u.side==='player'){
    ctx.beginPath();ctx.arc(0,0,r+8,0,Math.PI*2);
    ctx.strokeStyle='#ff4400';ctx.lineWidth=3;ctx.shadowColor='#ff4400';ctx.shadowBlur=20;ctx.stroke();ctx.shadowBlur=0;
  }
  if(u.stunT>0){
    ctx.beginPath();ctx.arc(0,0,r+5,0,Math.PI*2);
    ctx.strokeStyle='#ffff00';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
  ctx.lineWidth=u.selected?3:u.fleeing?2:1.5;
  ctx.strokeStyle=u.selected?'#fff':u.fleeing?'#ff4444':isP?'#5aaae8':'#e85a5a';ctx.stroke();
  if(u.selected){ctx.beginPath();ctx.arc(0,0,r+7,0,Math.PI*2);ctx.strokeStyle='#ffffff44';ctx.lineWidth=2.5;ctx.stroke();}
  ctx.font=`${Math.floor(r*.95)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillStyle='#fff';ctx.fillText(u.icon,0,1);ctx.shadowBlur=0;
  if(u.fleeing){ctx.font='11px sans-serif';ctx.fillStyle='#ff4444';ctx.fillText('↩',r,-r);}
  ctx.restore();

  const bw=r*2.4,bh=5,bx=x-bw/2,by=y-r-15;
  ctx.fillStyle='#0d0d0d';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=`hsl(${Math.round(u.hpPct*120)},75%,38%)`;ctx.fillRect(bx,by,bw*u.hpPct,bh);
  ctx.strokeStyle='#222';ctx.lineWidth=.5;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#0d0d0d';ctx.fillRect(bx,by-7,bw,4);
  ctx.fillStyle=u.morale>60?'#a0a030':u.morale>30?'#c06030':'#c03030';
  ctx.fillRect(bx,by-7,bw*u.morPct,4);
  ctx.strokeStyle='#222';ctx.lineWidth=.5;ctx.strokeRect(bx,by-7,bw,4);
  if(u.maxCnt>1){
    ctx.fillStyle='#000c';ctx.beginPath();ctx.roundRect(x-13,y+r+2,26,13,4);ctx.fill();
    ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.fillText(u.count,x,y+r+8);
  }
}

// Draw selection drag rect
function drawDragRect(){
  if(!dragRect)return;
  const{x,y,w,h}=dragRect;
  ctx.save();
  ctx.strokeStyle='#88ddff';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
  ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='rgba(100,180,255,0.06)';ctx.fillRect(x,y,w,h);
  ctx.setLineDash([]);ctx.restore();
}

// Draw spell targeting cursor + range indicator
function drawCastCursor(mx,my){
  if(!castingSpell)return;
  const spell=castingSpell.spell;
  const d=dist2(playerLord.x,playerLord.y,mx,my);
  const inRange=d<=spell.rng;

  // Range circle around lord
  ctx.save();
  ctx.beginPath();ctx.arc(playerLord.x,playerLord.y,spell.rng,0,Math.PI*2);
  ctx.strokeStyle=inRange?'rgba(0,255,100,0.3)':'rgba(255,100,0,0.3)';
  ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=inRange?'rgba(0,255,100,0.04)':'rgba(255,100,0,0.04)';
  ctx.fill();ctx.restore();

  // Line from lord to cursor
  ctx.save();
  ctx.beginPath();ctx.moveTo(playerLord.x,playerLord.y);ctx.lineTo(mx,my);
  ctx.strokeStyle=inRange?'rgba(0,255,100,0.5)':'rgba(255,100,0,0.5)';
  ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);ctx.restore();

  // Cursor icon
  ctx.save();
  ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=spell.color;ctx.shadowBlur=15;
  ctx.fillText(spell.ico,mx,my);
  ctx.shadowBlur=0;

  // Range indicator bar just below cursor
  const barW=80,barH=6;
  const bx=mx-barW/2,by=my+18;
  ctx.fillStyle='#111a';ctx.fillRect(bx,by,barW,barH);
  const pct=Math.min(1,d/spell.rng);
  const barColor=inRange?'#00ff88':'#ff4400';
  ctx.fillStyle=barColor;ctx.fillRect(bx,by,barW*pct,barH);
  ctx.strokeStyle='#333';ctx.lineWidth=0.5;ctx.strokeRect(bx,by,barW,barH);
  ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.fillText(inRange?'IN RANGE':'OUT OF RANGE',mx,by+barH+9);

  // AoE preview circle
  if(spell.aoe>0){
    ctx.beginPath();ctx.arc(mx,my,spell.aoe,0,Math.PI*2);
    ctx.strokeStyle=spell.color+'88';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.stroke();
    ctx.fillStyle=spell.color+'15';ctx.fill();ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawMeleeLines(){
  ctx.save();ctx.strokeStyle='#ff444422';ctx.lineWidth=1;
  units.filter(u=>u.inMelee&&u.meleeWith&&!u.dead).forEach(u=>{
    ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(u.meleeWith.x,u.meleeWith.y);ctx.stroke();
  });ctx.restore();
}
function drawMoveOrder(){
  const sel=selectedUnits.length>0?selectedUnits:[selectedUnit].filter(Boolean);
  sel.forEach(u=>{
    if(!u||u.dead||u.state!=='moving'||u.target)return;
    ctx.save();ctx.strokeStyle='#ffffff44';ctx.lineWidth=1;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(u.tx,u.ty);ctx.stroke();
    ctx.setLineDash([]);ctx.beginPath();ctx.arc(u.tx,u.ty,6,0,Math.PI*2);
    ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  });
}
function drawRangeCircles(){
  const sel=selectedUnits.filter(u=>u.rng&&!u.dead);
  sel.forEach(u=>{
    ctx.save();ctx.beginPath();ctx.arc(u.x,u.y,u.rng,0,Math.PI*2);
    ctx.strokeStyle='rgba(80,160,255,.15)';ctx.lineWidth=1;ctx.setLineDash([5,6]);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
  });
}

// ═══════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════
function cvXY(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hitUnit(mx,my,side){
  return units.find(u=>!u.dead&&(side?u.side===side:true)&&dist2(u.x,u.y,mx,my)<u.r+8);
}
function unitsInRect(rect){
  const x1=Math.min(rect.x,rect.x+rect.w),x2=Math.max(rect.x,rect.x+rect.w);
  const y1=Math.min(rect.y,rect.y+rect.h),y2=Math.max(rect.y,rect.y+rect.h);
  return units.filter(u=>u.side==='player'&&!u.dead&&u.x>=x1&&u.x<=x2&&u.y>=y1&&u.y<=y2);
}

let mouseX=0,mouseY=0;
canvas.addEventListener('mousemove',e=>{
  const{x,y}=cvXY(e);mouseX=x;mouseY=y;castMouseX=x;castMouseY=y;
  // Update drag rect
  if(isDragging&&dragStart){
    dragRect={x:dragStart.x,y:dragStart.y,w:x-dragStart.x,h:y-dragStart.y};
  }
  // Tooltip
  const tip=document.getElementById('tip');
  const hov=hitUnit(x,y,null);
  if(hov&&!castingSpell){
    tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';
    tip.textContent=`${hov.icon} ${hov.name}${hov.isLord?' [LORD]':''} — HP:${Math.round(hov.hpPct*100)}% Men:${hov.count} Mor:${Math.round(hov.morale)}`;
  }else tip.style.display='none';
  // Cursor style
  canvas.style.cursor=castingSpell?'none':'crosshair';
});
canvas.addEventListener('mouseleave',()=>{document.getElementById('tip').style.display='none';isDragging=false;dragStart=null;dragRect=null;});

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  ac();
  if(castingSpell)return; // don't start drag during cast
  const{x,y}=cvXY(e);
  dragStart={x,y};isDragging=false;dragRect=null;
});

canvas.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  const{x,y}=cvXY(e);

  // Finish cast
  if(castingSpell){
    finishCast(x,y);return;
  }

  // Was dragging? Select rect
  if(isDragging&&dragRect){
    const inR=unitsInRect(dragRect);
    if(inR.length>0)doSelect(inR);
    else doSelect([]);
    isDragging=false;dragStart=null;dragRect=null;
    return;
  }
  isDragging=false;dragStart=null;dragRect=null;

  // Normal click — select player unit
  const cl=hitUnit(x,y,'player');
  if(cl)doSelect([cl]);else doSelect([]);
});

// Start drag after small movement
canvas.addEventListener('mousemove',e=>{
  if(dragStart&&!castingSpell){
    const{x,y}=cvXY(e);
    const dx=x-dragStart.x,dy=y-dragStart.y;
    if(!isDragging&&Math.sqrt(dx*dx+dy*dy)>6){isDragging=true;}
    if(isDragging)dragRect={x:dragStart.x,y:dragStart.y,w:x-dragStart.x,h:y-dragStart.y};
  }
},{passive:true});

canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();ac();
  if(castingSpell){castingSpell=null;updateSpellBar();return;}
  const{x,y}=cvXY(e);
  const active=selectedUnits.length>0?selectedUnits:(selectedUnit?[selectedUnit]:[]);
  if(!active.length)return;
  if(gameState===GS.DEPLOY){
    if(active.length===1&&x<canvas.width*.25){active[0].x=x;active[0].y=y;active[0].tx=x;active[0].ty=y;}
    return;
  }
  if(gameState!==GS.BATTLE)return;
  const en=hitUnit(x,y,'ai');
  if(en){
    active.forEach(u=>{if(!u.fleeing&&!u.dead)u.orderAttack(en);});
    addLog(`${active.length>1?active.length+' units':active[0].icon+' '+active[0].name} → attack ${en.icon} ${en.name}`);
  }else{
    // Move in formation (slight offset per unit)
    active.forEach((u,i)=>{
      if(!u.fleeing&&!u.dead){
        const off=active.length>1?i*30-active.length*15:0;
        u.orderMove(x,y+off);
      }
    });
  }
});

// Keyboard
document.addEventListener('keydown',e=>{
  ac();
  if(e.key==='Escape'){castingSpell=null;updateSpellBar();return;}
  if(gameState!==GS.BATTLE)return;
  const LDef=LORDS[selectedLordType];
  LDef.spells.forEach((sp,i)=>{
    if(e.key.toUpperCase()===sp.key)beginCast(i);
  });
});

// Buttons
document.getElementById('btnMusic').addEventListener('click',toggleMusic);
document.getElementById('btnStart').addEventListener('click',()=>{
  if(gameState!==GS.DEPLOY)return;ac();
  gameState=GS.BATTLE;endChecked=false;
  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnRetreat').disabled=false;
  document.getElementById('ctrl-hint').style.display='';
  addLog(`⚔ Wave ${currentWave+1} begins!`,'imp');sndFanfare(true);
  setTimeout(()=>{
    const pl=units.filter(u=>u.side==='player'&&!u.dead);
    units.filter(u=>u.side==='ai'&&!u.dead).forEach(u=>u.aiPick(pl));
  },600);
});
document.getElementById('btnRetreat').addEventListener('click',()=>{
  if(gameState!==GS.BATTLE)return;
  units.filter(u=>u.side==='player'&&!u.dead&&!u.fleeing).forEach(u=>u.rout());
  addLog('⚑ Retreat!','bad');setTimeout(()=>endGame(false),3000);
});
document.getElementById('btnRestart').addEventListener('click',restartGame);
document.getElementById('btnEndRestart').addEventListener('click',restartGame);
document.getElementById('btnContinue').addEventListener('click',showLevelUp);
document.getElementById('btnSkip').addEventListener('click',closeLevelUp);

// ═══════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════
let lastTs=0;
function loop(ts){
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;

  if(gameState===GS.BATTLE){
    units.forEach(u=>u.update(dt,units));
    for(let i=projectiles.length-1;i>=0;i--){projectiles[i].update(dt);if(projectiles[i].dead)projectiles.splice(i,1);}
    tickParts(dt);tickAoE(dt);
    updateAI(dt);checkEnd();tickCooldowns(dt);
    clashTimer-=dt;
    if(clashTimer<=0){if(units.some(u=>u.inMelee&&!u.dead))sndSword();clashTimer=.18+Math.random()*.32;}
    updatePowerBar();
  }else{tickParts(dt);}

  // Draw
  drawBg();drawTerrain();drawDeployZones();
  drawMeleeLines();drawRangeCircles();drawMoveOrder();
  drawAoE();
  units.filter(u=>!u.dead).forEach(drawUnit);
  projectiles.forEach(p=>p.draw());drawParts();
  if(castingSpell&&playerLord&&!playerLord.dead)drawCastCursor(castMouseX,castMouseY);
  drawDragRect();

  updateSidebar();
  requestAnimationFrame(loop);
}

  box.querySelector('#pick-warrior').addEventListener('click',()=>{selectedLordType='WARRIOR';box.remove();boot();});
})();

function boot(){
  genTerrain();setupWave();updateActiveSkillsDisplay();
  addLog('⚔ Arena of Steel!','imp');
  addLog('LMB drag = select group | RMB = move/attack','');
  addLog('Click spell icon or press Q/W/E/R/T → click target','');
  requestAnimationFrame(ts=>{lastTs=ts;requestAnimationFrame(loop);});
}
</script>
</body>
</html>
